# Polaris v2 — Production compose (all three stacks)
#
# Pre-flight:
#   1. git push (commits must reach VPS via git pull)
#   2. uv run python packages/db-migrations/apply.py  (apply any pending migrations)
#   3. Fill .env with real values (SMTP, KMS key, secrets)
#   4. Fill ../polaris-cw-fork/.env with real CW values (SECRET_KEY_BASE, SMTP, etc.)
#   5. Generate prod Caddy basic-auth hash:
#        docker run --rm caddy:alpine caddy hash-password --plaintext '<your-password>'
#      Set result as CADDY_ADMIN_BASIC_AUTH_HASH in .env
#   6. Set ADMIN_CADDY_PROXY_TOKEN=<openssl rand -hex 32> in .env
#
# Run (from polaris/ repo root):
#   docker compose -f infra/docker-compose.prod.yml up -d --build
#
# First-run only (CW DB bootstrap, run AFTER containers are up):
#   docker compose -f infra/docker-compose.prod.yml exec chatwoot-rails bundle exec rake db:chatwoot_prepare
#
# Health check:
#   curl https://api.getpolaris.my/v1/health
#
# Memory limits — 8 GB VPS budget
# ─────────────────────────────────────────────────────────────────────────────
#   OS + Docker daemon reserve : ~800 MB
#   Total hard limits below    : ~5.8 GB
#   Headroom (page cache etc.) : ~1.4 GB
#
#   Limits are ceilings, not reservations. Docker OOM-kills the container and
#   restart: unless-stopped / always brings it back within seconds — far
#   preferable to an unbounded leak taking down the whole VPS.
#
#   Swap: Docker's default when only memory limit is set is to allow
#   swap = mem_limit (i.e. virtual = 2× limit). chatwoot-rails and
#   chatwoot-sidekiq benefit from this burst buffer while running in
#   dev mode; all others will rarely need it.

name: polaris-prod

services:
  # ── Caddy — TLS + reverse proxy for all 5 domains ───────────────────────────
  caddy:
    image: caddy:2.8-alpine
    container_name: prod-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ./caddy/maintenance:/etc/caddy/maintenance:ro
      - /opt/polaris/certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - ../.env
    depends_on:
      polaris-api:
        condition: service_healthy
      polaris-portal:
        condition: service_started
      polaris-admin:
        condition: service_started
      chatwoot-rails:
        condition: service_started
      ea-nginx:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

  # ── Polaris Redis ────────────────────────────────────────────────────────────
  polaris-redis:
    image: redis:7.2-alpine
    container_name: prod-polaris-redis
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme-set-in-env}
      --maxmemory 256mb
      --maxmemory-policy noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-changeme-set-in-env}
    volumes:
      - polaris_redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 320m # Redis maxmemory 256m + ~64m overhead

  # ── Polaris API ──────────────────────────────────────────────────────────────
  # PROD: pull from GHCR. Build + push with: infra/build.sh --tag vX.Y.Z --push
  polaris-api:
    image: ghcr.io/jiun01/polaris-api:v1.0.81
    container_name: prod-polaris-api
    env_file:
      - ../.env
    environment:
      ENVIRONMENT: production
      POLARIS_ENV: prod
      LOG_LEVEL: INFO
      # Force the real Mimir cost path in prod even though the shared .env keeps
      # COST_STUB_ENABLED=true for local dev (no local Mimir).
      COST_STUB_ENABLED: "false"
      # OTel resource attributes — service.namespace groups polaris-api under the
      # "polaris" namespace in Grafana Application Observability.
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=polaris
      # Internal redis (service name, not localhost)
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme-set-in-env}@polaris-redis:6379
      # CW runs in a separate compose stack — use public URL until shared network is wired
      CHATWOOT_BASE_URL: https://chat.getpolaris.my
      EA_API_BASE_URL: http://ea-nginx:80
      # Customer-facing booking URL for bot reply links and /b/{jti} redirect.
      # Distinct from EA_API_BASE_URL (internal nginx) — always the public domain.
      EA_BOOKING_PUBLIC_URL: ${EA_PUBLIC_URL:-https://calendar.getpolaris.my}
      # SMTP comes from .env — no MailHog override here
    depends_on:
      polaris-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    # DUAL-STACK bind — do NOT flip back to a single family. History: original
    # 0.0.0.0 (IPv6 clients refused) -> '::' (e5a9837) -> 0.0.0.0 (7a5ca3f) ->
    # '::' + sysctl net.ipv6.bindv6only=0 (90952cf) = 4th recurrence. Root cause
    # finally nailed: uvicorn runs on asyncio, and CPython's
    # asyncio.base_events.create_server UNCONDITIONALLY does
    # setsockopt(IPV6_V6ONLY, True) on every AF_INET6 listen socket it creates from
    # host/port — so `--host ::` is ALWAYS IPv6-only and the bindv6only=0 sysctl is
    # silently overridden. (Node/Puma honour the sysctl, which is why only
    # polaris-api kept refusing IPv4.) prod-net is dual-stack (polaris-api needs IPv6
    # egress for the IPv6-only direct Supabase DSN) so every container resolves to
    # BOTH A + AAAA; Chatwoot's Ruby agent-bot (no Happy-Eyeballs) prefers the IPv4
    # addr per RFC 6724 (fd00::/8 ULA deprioritised) -> a v6-only API = ECONNREFUSED
    # -> message_created silently dropped -> NO REPLY on any channel.
    # FIX: build the listen socket OURSELVES with IPV6_V6ONLY=0 and hand it to
    # uvicorn via Server.run(sockets=[...]). asyncio's create_server(sock=...) path
    # leaves a pre-bound socket untouched, so it stays genuinely dual-stack (v6 +
    # v4-mapped). The vps-update.sh mesh assertion fails the deploy if either family
    # is down. (No image rebuild needed — same image, different command.)
    command:
      - python
      - -c
      - |
        import socket, uvicorn
        sock = socket.socket(socket.AF_INET6, socket.SOCK_STREAM)
        sock.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
        sock.setsockopt(socket.IPPROTO_IPV6, socket.IPV6_V6ONLY, 0)
        sock.bind(("::", 8000))
        uvicorn.Server(uvicorn.Config("polaris_api.main:app")).run(sockets=[sock])
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  # ── Polaris Portal ───────────────────────────────────────────────────────────
  # PROD: pull from GHCR. Build + push with: infra/build.sh --tag vX.Y.Z --push
  polaris-portal:
    image: ghcr.io/jiun01/polaris-portal:v1.0.81
    container_name: prod-polaris-portal
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      ENVIRONMENT: production
      POLARIS_ENV: prod
      PORT: "3000"
      # Dual-stack: Next.js standalone binds process.env.HOSTNAME; '::' + bindv6only=0
      # serves both families so Caddy/NextAuth never hit a refused AAAA on prod-net.
      # See polaris-api comment above for the recurring IPv6 rationale.
      HOSTNAME: "::"
      NEXTAUTH_URL: https://portal.getpolaris.my
      NEXTAUTH_URL_INTERNAL: http://polaris-portal:3000
      POLARIS_API_INTERNAL_URL: http://polaris-api:8000
      # SMTP (EMAIL_SERVER_*) comes from .env — no MailHog override
    sysctls:
      - net.ipv6.bindv6only=0
    depends_on:
      polaris-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384m

  # ── Polaris Admin ────────────────────────────────────────────────────────────
  # PROD: pull from GHCR. Build + push with: infra/build.sh --tag vX.Y.Z --push
  polaris-admin:
    image: ghcr.io/jiun01/polaris-admin:v1.0.81
    container_name: prod-polaris-admin
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      ENVIRONMENT: production
      POLARIS_ENV: prod
      PORT: "3001"
      # Dual-stack (see polaris-portal/polaris-api): bind '::' so Caddy never hits a
      # refused AAAA for the admin upstream on the dual-stack prod-net.
      HOSTNAME: "::"
      POLARIS_API_BASE_URL: http://polaris-api:8000
      POLARIS_API_INTERNAL_URL: http://polaris-api:8000
      NEXTAUTH_URL_INTERNAL: http://polaris-admin:3001
      ADMIN_NEXTAUTH_URL: https://admin.getpolaris.my
      # SMTP (ADMIN_EMAIL_SERVER_*) comes from .env — no MailHog override
    sysctls:
      - net.ipv6.bindv6only=0
    depends_on:
      polaris-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384m

  # ── Chatwoot Postgres ────────────────────────────────────────────────────────
  # Renamed from 'postgres' to avoid colliding with any local service name.
  # CW services override DATABASE_URL to point here.
  chatwoot-postgres:
    image: pgvector/pgvector:pg16
    container_name: prod-chatwoot-postgres
    restart: always
    volumes:
      # MUST be /var/lib/postgresql/data (the image's PGDATA). The old
      # /data/postgres mount caught nothing — Postgres wrote to the container's
      # ephemeral layer, so every recreate wiped Chatwoot's database.
      - chatwoot_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=chatwoot
      - POSTGRES_USER=postgres
      # Password auth (trust removed): any container on prod-net previously got
      # superuser with no password. Set CW_PG_PASSWORD in .env for a strong value;
      # default keeps existing behaviour so an in-place bring-up doesn't break.
      - POSTGRES_PASSWORD=${CW_PG_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5433:5432"
    deploy:
      resources:
        limits:
          memory: 512m

  # ── Chatwoot Redis ───────────────────────────────────────────────────────────
  # Separate from Polaris Redis. CW services override REDIS_URL to point here.
  # Pinned to 7-alpine to match polaris-redis and avoid a fresh `pull` grabbing
  # Redis 8 (untested against the CW v4.14.0 fork).
  chatwoot-redis:
    image: redis:7.2-alpine
    container_name: prod-chatwoot-redis
    restart: always
    command:
      [
        "sh",
        "-c",
        'redis-server --requirepass "${CW_REDIS_PASSWORD:-chatwoot-redis-pass}" --maxmemory 128mb --maxmemory-policy noeviction',
      ]
    environment:
      - REDIS_PASSWORD=${CW_REDIS_PASSWORD:-chatwoot-redis-pass}
    volumes:
      # MUST be /data (redis writes RDB/AOF to its workdir /data). The old
      # /data/redis mount caught nothing — same ephemeral-layer bug as
      # chatwoot-postgres, just lower-impact (Sidekiq queue + cache only).
      - chatwoot_redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256m

  # ── Chatwoot Rails ───────────────────────────────────────────────────────────
  # PROD: baked fork image pulled from GHCR. To rebuild:
  #   docker build -t ghcr.io/jiun01/polaris-cw:v4.15.1-r3 -f polaris-cw-fork/docker/Dockerfile polaris-cw-fork/
  #   docker push ghcr.io/jiun01/polaris-cw:v4.15.1-r3
  chatwoot-rails:
    image: ghcr.io/jiun01/polaris-cw:v4.15.1-r3
    container_name: prod-chatwoot-rails
    env_file:
      - ../../polaris-cw-fork/.env
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - RAILS_SERVE_STATIC_FILES=true
      # enterprise/ tree is intentionally KEPT (enterprise?=true, ADR-060).
      # DO NOT set DISABLE_ENTERPRISE here — the Ruby check is `return if ENV.fetch('DISABLE_ENTERPRISE', false)`
      # which treats any non-empty string (including "false") as truthy, silently disabling enterprise.
      # Override service names (CW .env uses 'postgres'/'redis', we renamed them)
      - DATABASE_URL=postgres://postgres:${CW_PG_PASSWORD:-postgres}@chatwoot-postgres:5432/chatwoot
      - REDIS_URL=redis://:${CW_REDIS_PASSWORD:-chatwoot-redis-pass}@chatwoot-redis:6379
      - FRONTEND_URL=https://chat.getpolaris.my
      # SSRF escape hatch (cutover-critical). Upstream v4.14.2 routes all outbound
      # webhook + avatar fetches through SafeFetch -> ssrf_filter, which resolves the
      # target host and REJECTS private/loopback IPs. The Polaris agent-bot forwards
      # every inbound to polaris-api over the internal Docker network
      # (http://polaris-api:8000, resolves to 172.18.0.0/16). Without this flag the
      # forward dies with "Hostname 'polaris-api' has no public ip addresses", the
      # message is dropped, and the conversation is flipped to `open` — i.e. NO bot
      # reply, NO bot-handling label, NO portal sync. See ../docs/internal-ops/runbooks/chatwoot-native-cutover.md.
      - SAFE_FETCH_ALLOW_PRIVATE_NETWORK=true
    volumes:
      - cw_storage:/app/storage # uploads/attachments persistence (baked image has no bind-mount)
    depends_on:
      - chatwoot-postgres
      - chatwoot-redis
      - chatwoot-sidekiq
    entrypoint: /app/docker/entrypoints/rails.sh
    # Dual-stack bind (Puma): polaris-api's httpx internal calls (get_channel_token
    # via CHATWOOT_INTERNAL_BASE_URL=http://chatwoot-rails:3000) are a hard-fail
    # client — no Happy-Eyeballs — so a refused AAAA silently drops token capture.
    # '::' + bindv6only=0 serves both families. See polaris-api comment for history.
    sysctls:
      - net.ipv6.bindv6only=0
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "::"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024m

  # ── Chatwoot Sidekiq ─────────────────────────────────────────────────────────
  # PROD: same baked GHCR image as chatwoot-rails (background job worker).
  chatwoot-sidekiq:
    image: ghcr.io/jiun01/polaris-cw:v4.15.1-r3
    container_name: prod-chatwoot-sidekiq
    env_file:
      - ../../polaris-cw-fork/.env
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - DATABASE_URL=postgres://postgres:${CW_PG_PASSWORD:-postgres}@chatwoot-postgres:5432/chatwoot
      - REDIS_URL=redis://:${CW_REDIS_PASSWORD:-chatwoot-redis-pass}@chatwoot-redis:6379
      # Lockstep with chatwoot-rails — Sidekiq runs WhatsappEventsJob + AgentBots::WebhookJob,
      # which build ActiveStorage attachment data_urls AND serialize the agent-bot payload.
      # Without this override Sidekiq inherits FRONTEND_URL=http://0.0.0.0:3000 from the
      # cw-fork .env, so every attachment data_url is unreachable from polaris-api (voice
      # notes fail to download on ALL channels). The rails service already has this override.
      - FRONTEND_URL=https://chat.getpolaris.my
      # SSRF escape hatch — REQUIRED on sidekiq: AgentBots::WebhookJob (the inbound
      # forward to polaris-api) runs HERE, not in rails. Without it ssrf_filter
      # rejects the internal polaris-api target and every inbound is silently
      # dropped. Keep in lockstep with the chatwoot-rails value above.
      - SAFE_FETCH_ALLOW_PRIVATE_NETWORK=true
    volumes:
      - cw_storage:/app/storage # shared attachment storage with chatwoot-rails
    depends_on:
      - chatwoot-postgres
      - chatwoot-redis
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024m # ~547m idle; headroom for concurrent job processing

  # ── Chatwoot Vite ────────────────────────────────────────────────────────────
  # REMOVED for prod: the dev-mode vite asset server is gone. The GHCR image
  # (polaris-cw:v4.14.0-r1) ships pre-compiled assets via `rake assets:precompile`
  # at build time + RAILS_SERVE_STATIC_FILES=true, so Rails serves them directly.

  # ── EA PHP-FPM ───────────────────────────────────────────────────────────────
  # PROD: baked fork image pulled from GHCR. To rebuild:
  #   cd polaris-ea-fork && ./docker/build.sh --tag v1.6.0-r6 --push
  # r6 (2026-06-18): real intl/gd fix in the PRODUCTION Dockerfile. r5 shipped
  #   broken — its `apt-get purge --auto-remove` stripped libpng16/libicu* so
  #   gd+intl never loaded (502, since EA hard-requires intl). The r5-era fix
  #   only touched the DEV image; the prod Dockerfile still had --auto-remove and
  #   no load assert. r6 drops --auto-remove and adds the build-time assert.
  # r5 (2026-06-14): admin surface reachable:
  #   • root `/` → staff /login  (the r3 pin still did /→marketing redirect)
  #   • new `/admin` route alias → Login → /calendar  (EA 1.6 has no /admin path)
  # ⚠ After pulling, you MUST recreate the ea_app volume or the OLD baked app code
  #   persists in it and these routing fixes never apply — see fork-ghcr-push §5:
  #     docker compose -f infra/docker-compose.prod.yml rm -sf ea-php-fpm ea-nginx
  #     docker volume rm polaris-prod_ea_app
  #     docker compose -f infra/docker-compose.prod.yml up -d ea-php-fpm ea-nginx
  ea-php-fpm:
    image: ghcr.io/jiun01/polaris-ea:v1.6.0-r19
    container_name: prod-ea-php-fpm
    working_dir: /var/www/html
    environment:
      - EA_JWT_SIGNING_SECRET=${EA_JWT_SIGNING_SECRET}
      - POLARIS_EA_JWT_SECRET=${EA_JWT_SIGNING_SECRET}
      # EA self-configures config.php from these on boot (entrypoint, v1.6.0-r2+).
      - EA_DB_HOST=ea-mysql
      - EA_DB_NAME=easyappointments
      - EA_DB_USER=${EA_MYSQL_USER:-eauser}
      - EA_DB_PASSWORD=${EA_MYSQL_PASSWORD}
      - EA_BASE_URL=${EA_PUBLIC_URL:-https://calendar.getpolaris.my}
      - EA_DEBUG_MODE=false
      - EA_AUTO_MIGRATE=${EA_AUTO_MIGRATE:-true}
      # Polaris runtime config the app reads from env (application/config/polaris.php).
      - POLARIS_TURNSTILE_SITEKEY=${POLARIS_TURNSTILE_SITEKEY:-}
      - POLARIS_TURNSTILE_SECRET=${POLARIS_TURNSTILE_SECRET:-}
      - POLARIS_CORS_ORIGIN=${POLARIS_CORS_ORIGIN:-https://getpolaris.my}
      - POLARIS_WEBHOOK_SECRET=${EA_WEBHOOK_HMAC_SECRET:-}
      # Where EA POSTs the signed appointment-confirm callback (its /v1/webhooks/ea).
      # Signed with POLARIS_WEBHOOK_SECRET above (= EA_WEBHOOK_HMAC_SECRET) so Polaris
      # verifies it with the same shared key.
      - POLARIS_API_BASE_URL=${POLARIS_API_BASE_URL:-https://api.getpolaris.my}
      # SMTP for EA's transactional mail (provision reset link, appointment
      # notifications). Wired from the shared .env EMAIL_SERVER_* (Zoho). Without
      # EA_SMTP_HOST, application/config/email.php falls back to PHP mail() which
      # has no MTA in this image → "Could not instantiate mail function." 500.
      - EA_SMTP_HOST=${EMAIL_SERVER_HOST:-}
      - EA_SMTP_PORT=${EMAIL_SERVER_PORT:-587}
      - EA_SMTP_USER=${EMAIL_SERVER_USER:-}
      - EA_SMTP_PASS=${EMAIL_SERVER_PASSWORD:-}
      - EA_SMTP_FROM_NAME=Polaris
      - EA_SMTP_FROM_ADDRESS=noreply@getpolaris.my
    # Liveness = php-fpm accepting FastCGI on :9000. Overrides the image's baked
    # HEALTHCHECK (fixed to match in the EA fork Dockerfile r9+); the old check
    # used `pgrep`, absent from the slim Debian image → permanent (unhealthy).
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "$$f=@fsockopen('127.0.0.1',9000,$$e,$$s,2);exit($$f?0:1);",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      default:
        # The shared EA nginx.conf does `fastcgi_pass php-fpm:9000`; the dev
        # compose names this service `php-fpm`, prod names it `ea-php-fpm`, so
        # alias it here to keep the one nginx.conf working in both.
        aliases:
          - php-fpm
    volumes:
      # Shared app volume: php-fpm populates it from the baked image on FIRST
      # creation; ea-nginx mounts it read-only to serve static assets.
      # ⚠ named volumes only auto-populate once — after an image bump run
      #   `docker volume rm prod_ea_app` before `up -d`, or stale code persists.
      - ea_app:/var/www/html
    depends_on:
      - ea-mysql
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  # ── EA Nginx ─────────────────────────────────────────────────────────────────
  # No host port exposed — Caddy routes calendar.getpolaris.my → ea-nginx:80
  ea-nginx:
    image: nginx:1.27-alpine
    container_name: prod-ea-nginx
    working_dir: /var/www/html
    volumes:
      - ea_app:/var/www/html:ro # static assets from the baked EA image (via php-fpm-populated volume)
      # nginx.conf is vendored in-repo (./ea/nginx.conf) so `git pull` always ships
      # the current config — the EA fork is private and can't be curl'd by the VPS.
      - ./ea/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ea-php-fpm
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

  # ── EA MySQL ─────────────────────────────────────────────────────────────────
  # phpMyAdmin intentionally excluded — manage via `docker compose exec ea-mysql mysql`
  ea-mysql:
    image: mysql:8.0
    container_name: prod-ea-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${EA_MYSQL_ROOT_PASSWORD:-changeme-set-in-env}
      - MYSQL_DATABASE=easyappointments
      - MYSQL_USER=${EA_MYSQL_USER:-eauser}
      - MYSQL_PASSWORD=${EA_MYSQL_PASSWORD:-changeme-set-in-env}
    volumes:
      - ea_mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768m

networks:
  default:
    name: prod-net
    # Supabase direct connections (db.<ref>.supabase.co) are IPv6-only on the
    # free tier. The host has IPv6 egress, but a default bridge is IPv4-only, so
    # containers get "Network is unreachable" reaching the DB directly. Giving
    # the bridge a ULA subnet + daemon `ip6tables` NAT66 lets containers route
    # IPv6 out through the host's global address. Requires /etc/docker/daemon.json
    # `{"experimental": true, "ip6tables": true}` + `systemctl restart docker`.
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:dead:beef::/64

volumes:
  polaris_redis_data:
  chatwoot_postgres_data:
  chatwoot_redis_data:
