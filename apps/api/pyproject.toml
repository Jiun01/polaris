[project]
name = "polaris-api"
version = "0.0.0"
description = "Polaris FastAPI service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.135,<0.140",
  "uvicorn[standard]>=0.47,<0.50",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.6,<3",
  "asyncpg>=0.30,<0.40",
  "httpx>=0.28,<0.30",
  "pynacl>=1.6,<2",
  "python-json-logger>=2.0,<3",
  "watchfiles>=0.24,<2",
  "redis>=5.2,<6",
  # Phase 6 PR-4: E.164 normalisation in the audience CSV importer. Google's
  # libphonenumber Python port — same algorithm as Meta's own validation,
  # so a number we accept maps cleanly onto a number Meta will accept on
  # outbound. Tenant default_country_code seeds the region parameter.
  "phonenumbers>=8.13,<10",
  # Phase 6 PR-4: multipart upload parser for the audience CSV endpoint
  # (POST /api/tenant/audience/import). FastAPI's UploadFile dep is a
  # starlette wrapper around python-multipart; without this installed,
  # any route declaring File(...) fails at module import time.
  "python-multipart>=0.0.18,<1",
  # Phase 15 PR-3: server-side product-image downscale on upload (resize +
  # re-encode before persisting so the per-tenant MB cap holds far more photos
  # and images stay under Messenger's 8 MB URL limit per ADR-061 §6). Pillow is
  # the standard imaging lib; the upload handler imports it lazily so a minimal
  # build still loads the module (storing the original bytes as a fallback).
  "pillow>=10,<13",
  # PyJWT for HS256 token verification on the TenantContext dep. Chose PyJWT
  # over python-jose because the latter is unmaintained and python-jose's
  # last CVE-fix release cycle has been spotty; PyJWT ships HS256 in the
  # base install (no `crypto` extra needed until RS256/JWKS lands in v2.1).
  "pyjwt>=2.10,<3",
  # Phase 4 PR-1: LLM provider clients. anthropic for Sonnet 4.6 + Haiku
  # 4.5 (primary). openai for OpenRouter compatibility (fallback path —
  # OpenRouter speaks OpenAI's chat-completions API per ADR-031 Amendment
  # 2026-05-15).
  "anthropic>=0.45,<1",
  "openai>=1.50,<2",
  # Phase 4 PR-2: Cohere rerank client. cohere 5.x line — cohere>=6 has
  # a pydantic-core<2.44 pin that conflicts with our pydantic 2.13
  # workspace pin (needs pydantic-core>=2.46). cohere 5 has AsyncClient
  # with rerank (verified 2026-05-18). Tier-gated to Ultra+ tenants per
  # ADR-026 Amendment 5th — safe to import on Starter/Pro paths because
  # services/rag.py checks the placeholder-key guard before constructing
  # the client.
  "cohere>=5.13,<6",
  # Phase 9 PR-3: EmailStr validation on tenant admin invite requires email-validator.
  # pydantic[email] is the canonical extras alias; the standalone package works
  # equally well and makes the dep explicit rather than hidden in the extras.
  "email-validator>=2.1,<3",
  # Phase 9 PR-5: APScheduler for nightly audit chain verification job
  # (04:00 MYT cron per ADR-on-deck). AsyncIOScheduler + CronTrigger.
  "apscheduler>=3.10,<4",
  # Phase 9 PR-7/8/9: PDF generation (WeasyPrint) and HTML templating (Jinja2).
  "weasyprint>=53,<60",
  # WeasyPrint 59 needs pydyf 0.8.x; without this pin uv resolves pydyf 0.12
  # whose PDF.__init__ signature changed → "takes 1 positional argument but 3
  # were given" at render time. Keep aligned if weasyprint is bumped.
  "pydyf>=0.8,<0.9",
  "jinja2>=3.1,<4",
  # Phase 9 PR-11: Sentry error + alert reporting.
  "sentry-sdk>=2.0,<3",
  # Phase 10 PR-2: OpenTelemetry auto-instrumentation → Grafana Cloud OTLP (ADR-016).
  "opentelemetry-sdk>=1.20.0,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.20.0,<2",
  "opentelemetry-instrumentation-fastapi>=0.41b0",
  "opentelemetry-instrumentation-asyncpg>=0.41b0",
  "opentelemetry-instrumentation-httpx>=0.41b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<0.30",
  "pytest-cov>=5,<7",
  "mypy>=2,<3",
  "ruff>=0.7,<1",
  "httpx>=0.28,<0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polaris_api"]
