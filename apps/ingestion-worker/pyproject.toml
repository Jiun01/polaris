[project]
name = "polaris-ingestion-worker"
version = "0.0.0"
description = "Polaris cron-driven ingestion worker"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "mypy>=2,<3",
  "ruff>=0.7,<1",
]

[project.scripts]
polaris-ingest = "polaris_ingest.cron:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polaris_ingest"]
