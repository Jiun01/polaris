[project]
name = "polaris-shared-types"
version = "0.0.0"
description = "Polaris cross-runtime types (Pydantic SSOT)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.13,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "mypy>=2,<3",
  "ruff>=0.7,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["polaris_shared_types"]
