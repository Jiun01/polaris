[project]
name = "polaris-db-migrations"
version = "0.0.0"
description = "Polaris idempotent SQL migration applier"
requires-python = ">=3.12,<3.13"
dependencies = [
  "asyncpg>=0.30,<0.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<0.30",
  "mypy>=2,<3",
  "ruff>=0.7,<1",
]

[project.scripts]
polaris-migrate = "apply:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["apply.py", "*.sql"]
